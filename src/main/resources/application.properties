spring.application.name=trustdesk
spring.datasource.url=jdbc:postgresql://localhost:1998/trustdesk_db
spring.datasource.username=postgres
spring.datasource.password=Saurabh@1998
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ollama Embedding Model
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.embedding.keep-alive=5m

# Spring AI - PGVector Configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.table-name=vector_store

